name: deploy-insurance-assistant

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: windows-latest
    environment: DEV

    env:
      # --- Common script config (see .env-template) ---
      RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      FUNCTION_APP_NAME: ${{ vars.FUNCTION_APP_NAME }}
      STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
      KEYVAULT_NAME: ${{ vars.KEYVAULT_NAME }}
      RESOURCE_NAME_PREFIX: ${{ vars.RESOURCE_NAME_PREFIX }}

      # Optional (enables Foundry Project Connection + single-secret wiring)
      FUNCTION_X_FUNCTIONS_KEY: ${{ secrets.FUNCTION_X_FUNCTIONS_KEY }}

      # --- Search data-plane provisioning ---
      SEARCH_SERVICE_ENDPOINT: ${{ vars.SEARCH_SERVICE_ENDPOINT }}
      SEARCH_API_VERSION: ${{ vars.SEARCH_API_VERSION }}
      SEARCH_USE_AAD: ${{ vars.SEARCH_USE_AAD }}
      SEARCH_KNOWLEDGESOURCE_NAME: ${{ vars.SEARCH_KNOWLEDGESOURCE_NAME }}
      SEARCH_PRODUCT_ID_DELIMITER: ${{ vars.SEARCH_PRODUCT_ID_DELIMITER }}

      # --- Storage ingestion ---
      STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CONNECTION_STRING }}
      STORAGE_CONTAINER_NAME: ${{ vars.STORAGE_CONTAINER_NAME }}

      # --- Foundry embeddings for ingestion ---
      AI_SERVICE_ENDPOINT: ${{ vars.AI_SERVICE_ENDPOINT }}
      AI_MODEL_DEPLOYMENT: ${{ vars.AI_MODEL_DEPLOYMENT }}
      AI_MODEL_NAME: ${{ vars.AI_MODEL_NAME }}

      # --- Agent creation ---
      AI_SERVICE_PROJECT_ENDPOINT: ${{ vars.AI_SERVICE_PROJECT_ENDPOINT }}
      FUNCTION_BASE_URL: ${{ vars.FUNCTION_BASE_URL }}
      FUNCTION_PROJECT_CONNECTION_NAME: ${{ vars.FUNCTION_PROJECT_CONNECTION_NAME }}
      AI_AGENT_NAME: ${{ vars.AI_AGENT_NAME }}

      # Optional override for deploy.ps1 if directory queries aren't allowed in CI
      USER_OBJECT_ID: ${{ vars.USER_OBJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Azure OIDC secrets
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) { $missing += 'AZURE_CLIENT_ID' }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) { $missing += 'AZURE_TENANT_ID' }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID)) { $missing += 'AZURE_SUBSCRIPTION_ID' }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub Actions secrets: $($missing -join ', '). Add them in Settings > Secrets and variables > Actions > Secrets." 
          }

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r ./src/requirements.txt

      - name: Install Azure Functions Core Tools
        shell: pwsh
        run: |
          choco install azure-functions-core-tools-4 --no-progress -y
          func --version

      - name: Deploy infra (Bicep)
        shell: pwsh
        run: ./scripts/deploy.ps1

      - name: Provision Search knowledge source (data plane)
        shell: pwsh
        run: python ./src/search/indexing/create_knowledgesource.py

      - name: Publish Functions code
        shell: pwsh
        run: ./scripts/deploy-functions.ps1

      - name: Verify wiring
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Upload sample data
        shell: pwsh
        run: ./scripts/upload-test-data.ps1

      - name: Run indexer
        shell: pwsh
        run: ./scripts/run-indexer.ps1 -Wait

      - name: Create/update agent
        shell: pwsh
        run: python ./src/agent/create_agent.py
